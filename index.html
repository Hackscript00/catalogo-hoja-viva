<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo Hoja Viva</title>
<meta name="description" content="Catálogo de ejemplo: agendas, planners y papelería. Pedidos por WhatsApp.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: catálogo de feria pensado para el celular — portada corta, grilla de productos, pedido fijo abajo; modo edición para la dueña */
:root{
  --bg:#FFFFFF; --surface:#F1F6F5; --ink:#17363D; --muted:#55696D; --line:#D6E3E0;
  --accent:#E06A4E; --accent-ink:#FFFFFF; --teal:#28756E; --gold:#E8B35C; --off:#9AA7A9; --danger:#B3261E;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F2226; --surface:#17343A; --ink:#EAF3F1; --muted:#A9C0BC; --line:#28474E;
  --accent:#F08166; --accent-ink:#1A1A1A; --teal:#5FB3A9; --gold:#F0C374; --off:#6F8589; --danger:#F2867E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F2226; --surface:#17343A; --ink:#EAF3F1; --muted:#A9C0BC; --line:#28474E;
  --accent:#F08166; --accent-ink:#1A1A1A; --teal:#5FB3A9; --gold:#F0C374; --off:#6F8589; --danger:#F2867E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}
.wrap{max-width:1040px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.demo{margin-top:16px;padding:10px 14px;border:1px dashed var(--teal);border-radius:10px;color:var(--teal);font-size:14px;font-weight:600}
header{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(36px,7vw,60px);line-height:1;letter-spacing:-.02em;text-wrap:balance;margin:0;overflow-wrap:anywhere}
.brand span{color:var(--accent)}
.tag{margin:10px 0 0;color:var(--muted);max-width:52ch}
.feria{min-width:0;background:var(--surface);border-radius:14px;padding:14px 16px;font-size:14px}
.feria b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
.num{user-select:all;font-weight:700}
.tools{display:flex;justify-content:flex-end;padding-top:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:20px 8px}
.chip{font-weight:600;font-size:14px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-block:12px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.card.out .cover,.card.out h3,.card.out .price{opacity:.55}
.cover{position:relative;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--surface);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.book{width:46%;aspect-ratio:3/4;border-radius:4px 10px 10px 4px;position:relative;box-shadow:6px 8px 0 rgba(0,0,0,.12)}
.book::before{content:"";position:absolute;left:8%;top:6%;bottom:6%;width:6px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.85) 0 5px,transparent 5px 12px)}
.book i{position:absolute;right:12%;bottom:12%;left:28%;height:18%;border-radius:3px;background:rgba(255,255,255,.75)}
.badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;background:var(--gold);color:#1F2D30;border-radius:999px;padding:3px 10px}
.soldout{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 10px}
.info{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1;min-width:0}
.info h3{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.info p{margin:0;color:var(--muted);font-size:14px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.price{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:36px;height:36px;border:0;background:transparent;font-size:20px;cursor:pointer;border-radius:999px}
.qty button:disabled{color:var(--off);cursor:not-allowed}
.qty output{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.how div{min-width:0}
.how h4{margin:0 0 4px;font-size:15px}
.how p{margin:0;color:var(--muted);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);z-index:5;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.sum{min-width:0}
.sum small{display:block;opacity:.8;font-size:13px}
.sum strong{font-size:22px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 20px;text-decoration:none;cursor:pointer}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.small{font-size:14px;padding:8px 14px}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.msg{flex-basis:100%;font-size:13px;opacity:.85;white-space:pre-line;max-height:0;overflow:hidden;transition:max-height .2s}
.msg.open{max-height:300px}
/* modo edición */
.ed h2{font-family:var(--display);font-size:28px;margin:28px 0 4px}
.ed .lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
.panel{background:var(--surface);border-radius:16px;padding:18px;display:grid;gap:14px;margin-bottom:20px}
.panel h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;min-width:0}
label.f span.hint{font-weight:400;color:var(--muted);font-size:13px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.f textarea{min-height:70px;resize:vertical}
.full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--teal)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.thumb{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .book{width:52%;box-shadow:none}
.item .meta{min-width:0}
.item .meta b{display:block;overflow-wrap:anywhere}
.item .meta small{color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px}
.pill.on{background:var(--teal);color:var(--bg)}
.pill.offp{background:var(--off);color:#fff}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.status{font-size:14px;font-weight:600}
.note{font-size:13px;color:var(--muted)}
@media (max-width:560px){header{grid-template-columns:1fr}.item{grid-template-columns:48px 1fr}.item .acts{grid-column:1/-1;justify-content:flex-start}.thumb{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
</style>
<div id="app"></div>
<script type="application/json" id="data">{"biz":{"name":"Hoja Viva","tag":"Agendas, planners y papelería hecha a mano en Puerto Montt. Elige lo que te gusta, arma tu pedido y nos lo envías por WhatsApp.","place":"Ferias itinerantes del Proyecto Muelle, Puerto Montt. Despachos a todo Chile.","wa":"56927776873"},"products":[{"id":"p1","n":"Agenda 2027 anillada","d":"Vista semanal, tapa dura forrada en tela, 160 hojas.","p":14990,"cat":"Agendas y planners","c":"#28756E","badge":"Temporada","ok":true,"img":""},{"id":"p2","n":"Planner mensual sin fecha","d":"Para partir cualquier mes. Incluye hoja de metas y presupuesto.","p":9990,"cat":"Agendas y planners","c":"#E06A4E","badge":"","ok":true,"img":""},{"id":"p3","n":"Planner de emprendedora","d":"Ventas del día, costos, pedidos y clientes en un solo lugar.","p":12990,"cat":"Agendas y planners","c":"#17363D","badge":"Más vendido","ok":true,"img":""},{"id":"p4","n":"Libreta A5 punteada","d":"Papel de 100 g, 120 hojas, ideal para lettering.","p":6990,"cat":"Libretas","c":"#E8B35C","badge":"","ok":false,"img":""},{"id":"p5","n":"Pack 3 libretas A6","d":"Tamaño bolsillo, tapas de colores surtidos.","p":7990,"cat":"Libretas","c":"#7A9E7E","badge":"","ok":true,"img":""},{"id":"p6","n":"Set de stickers del sur","d":"24 stickers ilustrados: Chiloé, el Muelle y la lluvia.","p":3990,"cat":"Regalos y accesorios","c":"#5B7DB1","badge":"","ok":true,"img":""},{"id":"p7","n":"Calendario de escritorio","d":"12 láminas ilustradas con base de cartón reciclado.","p":8490,"cat":"Regalos y accesorios","c":"#B05A7A","badge":"Temporada","ok":true,"img":""},{"id":"p8","n":"Tarjetas de regalo (pack 6)","d":"Con sobre kraft. Para cumpleaños y fechas especiales.","p":4990,"cat":"Regalos y accesorios","c":"#C0492F","badge":"","ok":true,"img":""}]}</script>
<script id="app-js">
const COLORS=["#28756E","#E06A4E","#17363D","#E8B35C","#7A9E7E","#5B7DB1","#B05A7A","#C0492F"];
const state=JSON.parse(document.getElementById("data").textContent);
const app=document.getElementById("app");
const q={};let filtro="Todo";let mode="view";let draft=null;let editing=null;let confirmDel=null;
let canEdit=false,artifactNS=null,assetsNS=null,status="";
const clp=n=>"$"+Number(n||0).toLocaleString("es-CL");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtWa=w=>{const d=String(w||"").replace(/\D/g,"");return d.length===11&&d.startsWith("569")?`+56 9 ${d.slice(3,7)} ${d.slice(7)}`:(d?"+"+d:"");};
const imgSrc=p=>p.img?"/_blob/"+p.img:"";
const brandHTML=name=>{const w=esc(name).trim().split(/\s+/);return w.length>1?w.slice(0,-1).join(" ")+" <span>"+w[w.length-1]+"</span>":w[0]||"";};
const cover=(p,cls)=>p.img?`<img src="${imgSrc(p)}" alt="Foto de ${esc(p.n)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'book',style:'background:${esc(p.c)}',innerHTML:'<i></i>'}))">`:`<div class="book" style="background:${esc(p.c)}"><i></i></div>`;

/* ---------- vista de clientes ---------- */
function viewHTML(){
  const S=state,cats=["Todo",...new Set(S.products.map(p=>p.cat).filter(Boolean))];
  if(!cats.includes(filtro))filtro="Todo";
  const list=S.products.filter(p=>filtro==="Todo"||p.cat===filtro);
  return `<div class="wrap">
  <div class="demo">Catálogo de ejemplo para la propuesta del Proyecto Muelle. La marca, los productos y los precios son ilustrativos.</div>
  ${canEdit?`<div class="tools"><button class="btn small line" data-act="edit" type="button">Editar catálogo</button></div>`:""}
  <header><div><h1 class="brand">${brandHTML(S.biz.name)}</h1><p class="tag">${esc(S.biz.tag)}</p></div>
  <div class="feria"><b>Dónde encontrarnos</b>${esc(S.biz.place)}${S.biz.wa?`<br>WhatsApp: <span class="num">${esc(fmtWa(S.biz.wa))}</span>`:""}</div></header>
  <div class="filters" role="group" aria-label="Filtrar por tipo">${cats.map(c=>`<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c===filtro}">${esc(c)}</button>`).join("")}</div>
  ${list.length?`<div class="grid">${list.map(p=>`<article class="card${p.ok?"":" out"}">
    <div class="cover">${cover(p)}${p.badge?`<span class="badge">${esc(p.badge)}</span>`:""}${p.ok?"":`<span class="soldout">Agotado</span>`}</div>
    <div class="info"><h3>${esc(p.n)}</h3><p>${esc(p.d)}</p>
    <div class="row"><span class="price">${clp(p.p)}</span>
    <div class="qty"><button type="button" aria-label="Quitar ${esc(p.n)}" data-q="-" data-id="${esc(p.id)}" ${p.ok?"":"disabled"}>−</button><output id="q_${esc(p.id)}">${q[p.id]||0}</output><button type="button" aria-label="Agregar ${esc(p.n)}" data-q="+" data-id="${esc(p.id)}" ${p.ok?"":"disabled"}>+</button></div></div></div></article>`).join("")}</div>`
  :`<div class="empty">Todavía no hay productos en el catálogo.${canEdit?" Toca “Editar catálogo” para agregar el primero.":""}</div>`}
  <section class="how" aria-label="Cómo comprar">
    <div><h4>1. Elige</h4><p>Suma productos con el botón +. El total se calcula solo. Los agotados no se pueden pedir.</p></div>
    <div><h4>2. Envía</h4><p>Toca "Pedir por WhatsApp" y el mensaje sale listo con tu pedido.</p></div>
    <div><h4>3. Recibe</h4><p>Retira en la próxima feria o pide despacho a tu ciudad.</p></div>
  </section></div>
  <div class="bar" aria-live="polite"><div class="wrap">
    <div class="sum"><small id="count"></small><strong id="total"></strong></div>
    <div class="actions"><button class="btn ghost" id="copy" type="button">Copiar pedido</button>
    <a class="btn" id="wa" href="#" target="_blank" rel="noopener">Pedir por WhatsApp</a></div>
    <div class="msg" id="msg"></div></div></div>`;
}
function pedido(){
  const items=state.products.filter(p=>p.ok&&q[p.id]);
  if(!items.length)return"";
  const t=items.reduce((a,p)=>a+p.p*q[p.id],0);
  return `Hola ${state.biz.name}, quiero hacer este pedido:\n${items.map(p=>`• ${q[p.id]} x ${p.n} (${clp(p.p*q[p.id])})`).join("\n")}\nTotal: ${clp(t)}`;
}
function updateOrder(){
  if(mode!=="view")return;
  const items=state.products.filter(p=>p.ok&&q[p.id]);
  const n=items.reduce((a,p)=>a+q[p.id],0),t=items.reduce((a,p)=>a+p.p*q[p.id],0),tx=pedido();
  document.getElementById("count").textContent=n?`${n} producto${n>1?"s":""} en tu pedido`:"Tu pedido está vacío";
  document.getElementById("total").textContent=clp(t);
  const wa=document.getElementById("wa"),cp=document.getElementById("copy"),m=document.getElementById("msg");
  const num=String(state.biz.wa||"").replace(/\D/g,"");
  wa.href=tx?`https://wa.me/${num}?text=${encodeURIComponent(tx)}`:"#";
  wa.setAttribute("aria-disabled",tx?"false":"true");cp.setAttribute("aria-disabled",tx?"false":"true");
  m.textContent=tx;m.classList.toggle("open",!!tx);
}

/* ---------- modo edición ---------- */
const blank=()=>({id:"p"+Date.now().toString(36),n:"",d:"",p:"",cat:"",c:COLORS[0],badge:"",ok:true,img:""});
function editHTML(){
  const D=draft,cats=[...new Set(D.products.map(p=>p.cat).filter(Boolean))];
  const form=editing?`<div class="panel" id="pform"><h3>${D.products.some(p=>p.id===editing.id)?"Editar producto":"Nuevo producto"}</h3>
    <div class="fields">
      <label class="f">Nombre<input id="f_n" value="${esc(editing.n)}" maxlength="60" placeholder="Ej: Agenda 2027"></label>
      <label class="f">Precio (en pesos)<input id="f_p" inputmode="numeric" value="${esc(editing.p)}" placeholder="Ej: 9990"></label>
      <label class="f">Categoría<input id="f_cat" list="cats" value="${esc(editing.cat)}" placeholder="Ej: Libretas"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
      <label class="f">Etiqueta <span class="hint">Opcional. Ej: Nuevo, Temporada</span><input id="f_badge" value="${esc(editing.badge)}" maxlength="20"></label>
      <label class="f full">Descripción<textarea id="f_d" maxlength="160">${esc(editing.d)}</textarea></label>
      <div class="f full"><span>Foto</span>
        ${assetsNS?`<div class="row" style="justify-content:flex-start;flex-wrap:wrap">
          <div class="thumb">${cover(editing)}</div>
          <label class="btn small line" for="f_img">${editing.img?"Cambiar foto":"Subir foto"}</label><input id="f_img" type="file" accept="image/*" hidden>
          ${editing.img?`<button class="btn small line" type="button" data-act="noimg">Quitar foto</button>`:""}</div>
          <span class="note">Si no subes foto, se muestra una portada de color.</span>`
        :`<span class="note">Subir fotos no está disponible en esta vista. Se muestra una portada de color.</span>`}</div>
      <div class="f full"><span>Color de portada</span><div class="swatches">${COLORS.map(c=>`<button type="button" class="sw" style="background:${c}" data-sw="${c}" aria-label="Color ${c}" aria-pressed="${editing.c===c}"></button>`).join("")}</div></div>
      <label class="check full"><input type="checkbox" id="f_ok" ${editing.ok?"checked":""}> Disponible para pedir</label>
    </div>
    <div class="actions"><button class="btn small" type="button" data-act="saveitem">Listo</button><button class="btn small line" type="button" data-act="cancelitem">Cancelar</button></div>
    <span class="status" id="formerr" role="alert"></span></div>`:"";
  return `<div class="wrap ed">
  <h2>Editar catálogo</h2>
  <p class="lead">Agrega tus productos, cambia precios y marca lo que se agotó. Los clientes ven los cambios cuando tocas “Guardar cambios”.</p>
  <div class="panel"><h3>Datos del negocio</h3><div class="fields">
    <label class="f">Nombre del negocio<input id="b_name" value="${esc(D.biz.name)}" maxlength="40"></label>
    <label class="f">WhatsApp <span class="hint">Con código de país. Ej: 56912345678</span><input id="b_wa" inputmode="tel" value="${esc(D.biz.wa)}"></label>
    <label class="f full">Descripción corta<textarea id="b_tag" maxlength="200">${esc(D.biz.tag)}</textarea></label>
    <label class="f full">Dónde encontrarte<input id="b_place" value="${esc(D.biz.place)}" maxlength="140"></label>
  </div></div>
  ${form}
  <div class="panel"><div class="row" style="margin:0"><h3>Productos (${D.products.length})</h3>${editing?"":`<button class="btn small" type="button" data-act="add">+ Agregar producto</button>`}</div>
  ${D.products.length?`<div class="list">${D.products.map(p=>`<div class="item">
    <div class="thumb">${cover(p)}</div>
    <div class="meta"><b>${esc(p.n)}<span class="pill ${p.ok?"on":"offp"}">${p.ok?"Disponible":"Agotado"}</span></b><small>${clp(p.p)} · ${esc(p.cat||"Sin categoría")}</small></div>
    <div class="acts">${confirmDel===p.id?`<span class="status">¿Eliminar?</span><button class="btn small danger" type="button" data-del="${esc(p.id)}">Sí, eliminar</button><button class="btn small line" type="button" data-act="nodel">No</button>`
    :`<button class="btn small line" type="button" data-tog="${esc(p.id)}">${p.ok?"Marcar agotado":"Marcar disponible"}</button><button class="btn small line" type="button" data-ed="${esc(p.id)}">Editar</button><button class="btn small line" type="button" data-ask="${esc(p.id)}">Eliminar</button>`}</div></div>`).join("")}</div>`
  :`<div class="empty">Aún no hay productos. Toca “+ Agregar producto”.</div>`}</div></div>
  <div class="bar"><div class="wrap"><span class="status" id="savestatus">${esc(status||"Los cambios no se ven hasta que los guardes.")}</span>
  <div class="actions"><button class="btn ghost" type="button" data-act="discard">Salir sin guardar</button><button class="btn" type="button" data-act="publish" ${editing?"disabled":""}>Guardar cambios</button></div></div></div>`;
}
function readBiz(){if(mode!=="edit")return;const v=id=>document.getElementById(id)?.value??"";
  draft.biz={name:v("b_name").trim()||"Mi emprendimiento",wa:v("b_wa").replace(/\D/g,""),tag:v("b_tag").trim(),place:v("b_place").trim()};}
function readForm(){if(!editing)return;const v=id=>document.getElementById(id)?.value??"";
  Object.assign(editing,{n:v("f_n").trim(),p:v("f_p").replace(/\D/g,""),cat:v("f_cat").trim(),badge:v("f_badge").trim(),d:v("f_d").trim(),ok:!!document.getElementById("f_ok")?.checked});}

/* ---------- guardar: regenera la página completa desde el estado ---------- */
function buildDoc(s){
  const json=JSON.stringify(s).replace(/</g,"\\u003c");
  const css=document.getElementById("css").textContent,js=document.getElementById("app-js").textContent;
  const reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>Catálogo '+esc(s.biz.name)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
   +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">\n'
   +'<style id="css">'+css+'</style>\n<div id="app"></div>\n'
   +'<script type="application/json" id="data">'+json+'<\/script>\n'
   +'<script id="app-js">'+js+'<\/script>\n</body></html>';
}
async function publish(){
  readBiz();
  if(!artifactNS){setStatus("Guardar no está disponible en esta vista.");return;}
  setStatus("Guardando…");
  try{await artifactNS.publish(buildDoc(draft));setStatus("Guardado. La página se actualiza…");}
  catch(e){const c=e&&e.code;
    if(c==="conflict")setStatus("Alguien guardó otra versión antes. La página se recarga con esa versión.");
    else if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].includes(c)){canEdit=false;mode="view";draft=null;render();}
    else if(c==="too_large")setStatus("El catálogo es demasiado grande para guardarlo. Quita algunos productos.");
    else if(c==="rate_limited")setStatus("Guardaste muchas veces seguidas. Espera un minuto y vuelve a intentar.");
    else setStatus("No se pudo guardar. Revisa tu conexión y vuelve a intentar.");}
}
function setStatus(t){status=t;const el=document.getElementById("savestatus");if(el)el.textContent=t;}
async function uploadPhoto(file){
  const err=document.getElementById("formerr");readForm();
  if(!assetsNS||!file)return;
  if(err)err.textContent="Subiendo foto…";
  try{
    const bmp=await createImageBitmap(file);const sc=Math.min(1,1000/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.82));
    const res=await assetsNS.upload(blob,{type:"image/jpeg"});editing.img=res.id;render();
  }catch(e){if(err)err.textContent=e&&e.code==="too_large"?"La foto es muy pesada. Prueba con otra.":"No se pudo subir la foto. Prueba otra vez.";}
}

/* ---------- render y eventos ---------- */
function render(){app.innerHTML=mode==="edit"?editHTML():viewHTML();if(mode==="view")updateOrder();}
app.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-act]");if(!t)return;
  if(mode==="view"){
    if(t.dataset.cat){filtro=t.dataset.cat;render();return;}
    if(t.dataset.q&&!t.disabled){const id=t.dataset.id;q[id]=Math.max(0,(q[id]||0)+(t.dataset.q==="+"?1:-1));document.getElementById("q_"+id).textContent=q[id];updateOrder();return;}
    if(t.id==="copy"){const tx=pedido();if(!tx)return;navigator.clipboard.writeText(tx).then(()=>{t.textContent="Pedido copiado";setTimeout(()=>t.textContent="Copiar pedido",1800)}).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("msg"));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent="Texto seleccionado";});return;}
    if(t.dataset.act==="edit"&&canEdit){draft=JSON.parse(JSON.stringify(state));mode="edit";status="";editing=null;confirmDel=null;render();window.scrollTo(0,0);}
    return;
  }
  readBiz();readForm();
  const a=t.dataset.act,find=id=>draft.products.find(p=>p.id===id);
  if(t.dataset.sw){editing.c=t.dataset.sw;render();return;}
  if(t.dataset.tog){const p=find(t.dataset.tog);p.ok=!p.ok;render();return;}
  if(t.dataset.ed){editing={...find(t.dataset.ed)};confirmDel=null;render();document.getElementById("pform")?.scrollIntoView({block:"start"});return;}
  if(t.dataset.ask){confirmDel=t.dataset.ask;render();return;}
  if(t.dataset.del){draft.products=draft.products.filter(p=>p.id!==t.dataset.del);confirmDel=null;render();return;}
  if(a==="nodel"){confirmDel=null;render();return;}
  if(a==="add"){editing=blank();confirmDel=null;render();document.getElementById("pform")?.scrollIntoView({block:"start"});document.getElementById("f_n")?.focus();return;}
  if(a==="noimg"){editing.img="";render();return;}
  if(a==="cancelitem"){editing=null;render();return;}
  if(a==="saveitem"){
    const err=document.getElementById("formerr");
    if(!editing.n){err.textContent="Escribe el nombre del producto.";return;}
    if(!editing.p){err.textContent="Escribe el precio, solo con números.";return;}
    editing.p=Number(editing.p);
    const i=draft.products.findIndex(p=>p.id===editing.id);if(i>=0)draft.products[i]=editing;else draft.products.push(editing);
    editing=null;setStatus("Hay cambios sin guardar.");render();return;}
  if(a==="discard"){mode="view";draft=null;editing=null;render();window.scrollTo(0,0);return;}
  if(a==="publish"){publish();}
});
app.addEventListener("change",e=>{if(e.target.id==="f_img")uploadPhoto(e.target.files[0]);});
render();

</script>

</body>
</html>
